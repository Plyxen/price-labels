// dBase / FoxPro / Clipper tables (.dbf), the native format of many DOS-era stock programs
const DBF_VERSIONS = new Set([0x02, 0x03, 0x04, 0x05, 0x30, 0x31, 0x32, 0x43, 0x63, 0x83, 0x8B, 0x8E, 0xCB, 0xF5, 0xFB]);
const DBF_CODEPAGES = { 0x01: 852, 0x02: 852, 0x64: 852, 0x03: 1250, 0x57: 1250, 0xC8: 1250 }; // header byte 29
function isDbf(u8, ext) {
  if (u8.length < 65 || !DBF_VERSIONS.has(u8[0]) || u8[2] < 1 || u8[2] > 12 || u8[3] < 1 || u8[3] > 31) return false;
  const dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
  const recs = dv.getUint32(4, true), hlen = dv.getUint16(8, true), rlen = dv.getUint16(10, true);
  return hlen >= 65 && rlen >= 2 && (ext === 'dbf' || Math.abs(u8.length - (hlen + recs * rlen)) <= 1);
}
function dbfRows(u8) {
  const dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
  const recs = dv.getUint32(4, true), hlen = dv.getUint16(8, true), rlen = dv.getUint16(10, true);
  const fields = [];
  for (let p = 32, off = 1; p + 32 <= hlen && u8[p] !== 0x0D; p += 32) {
    const type = String.fromCharCode(u8[p + 11]);
    const len = type === 'C' ? u8[p + 16] | (u8[p + 17] << 8) : u8[p + 16]; // Clipper keeps long text widths in the decimals byte
    fields.push({ name: latin1(u8.subarray(p, p + 11)).replace(/\0[\s\S]*$/, '').trim(), type, off, len });
    off += len;
  }
  const n = Math.max(0, Math.min(recs, Math.floor((u8.length - hlen) / rlen)));
  const cp = DBF_CODEPAGES[u8[29]] || guessCodepage(u8.subarray(hlen, hlen + n * rlen));
  const ascii = (b) => latin1(b).trim();
  const value = (p, f) => {
    const raw = u8.subarray(p, p + f.len);
    switch (f.type) {
      case 'C': return decode8bit(raw, cp).replace(/\0/g, '').trim();
      case 'N': case 'F': return toNumber(ascii(raw));
      case 'L': return /[TtYyIi]/.test(ascii(raw)) ? 'igen' : '';
      case 'D': { const s = ascii(raw); return /^\d{8}$/.test(s) ? `${s.slice(0, 4)}.${s.slice(4, 6)}.${s.slice(6)}` : s; }
      case 'I': return f.len === 4 ? dv.getInt32(p, true) : '';
      case 'Y': return f.len === 8 ? Number(dv.getBigInt64(p, true)) / 10000 : '';
      case 'B': case 'O': return f.len === 8 ? dv.getFloat64(p, true) : ''; // FoxPro double
      default: return ''; // memo and binary fields live in a separate file
    }
  };
  const rows = [fields.map((f) => f.name)];
  for (let r = 0; r < n; r++) {
    const base = hlen + r * rlen;
    if (u8[base] !== 0x2A) rows.push(fields.map((f) => value(base + f.off, f))); // '*' = deleted record
  }
  return rows;
}

async function fileRows(name, u8) {
  const ext = (name.split('.').pop() || '').toLowerCase();
  if (u8[0] === 0x50 && u8[1] === 0x4B) return xlsxRows(u8);                                  // PK.. = zip/xlsx
  if (u8[0] === 0xD0 && u8[1] === 0xCF && u8[2] === 0x11 && u8[3] === 0xE0) return xlsRows(u8); // Excel 97-2003 / 5.0
  if (isDbf(u8, ext)) return dbfRows(u8);
  const text = decodeText(u8);
  if (/^\s*</.test(text) && /urn:schemas-microsoft-com:office:spreadsheet/.test(text.slice(0, 5000))) {
    const rows = xmlSheetRows(text);
    if (rows) return rows;
  }
  if (/^\s*</.test(text) && /<table/i.test(text)) { const rows = htmlRows(text); if (rows) return rows; }
  if (ext === 'json') {
    const data = JSON.parse(text);
    const list = Array.isArray(data) ? data : data.products || [];
    return [[...CSV_HEAD],
      ...list.map((p) => [p.sku || '', p.name || '', p.detail || '', p.price ?? '', p.stock ?? '', p.unit || '', p.cat || '', p.drs ? 'igen' : '', p.min ?? '', p.full ?? '',
        (p.codes || []).join(' ')])];
  }
  return parseDelimited(text);
}

// Hungarian/English number formats: "17290", "17 290", "17.290", "4 488,18", "8.500,- Ft", "4488.18", "0,00 Darab"
function parseDecimal(v) {
  if (typeof v === 'number') return isFinite(v) ? v : null;
  let s =String(v ?? '').replace(/[\s  ]/g, '').replace(/,-+/, '').replace(/[^\d.,-]+$/, '');
  if (!s) return null;
  const dots = (s.match(/\./g) || []).length, commas = (s.match(/,/g) || []).length;
  if (dots && commas) s = s.lastIndexOf(',') > s.lastIndexOf('.') ? s.replace(/\./g, '').replace(',', '.') : s.replace(/,/g, '');
  else if (commas) s = commas > 1 || /,\d{3}$/.test(s) ? s.replace(/,/g, '') : s.replace(',', '.');
  else if (dots) s = dots > 1 || /\.\d{3}$/.test(s) ? s.replace(/\./g, '') : s;
  return /^-?\d+(\.\d+)?$/.test(s) ? parseFloat(s) : null;
}
function parseNumber(v) {
  const n = parseDecimal(v);
  return n === null || n < 0 ? null : Math.round(n);
}

const headerNorm = (h) => norm(h).replace(/[^a-z0-9]+/g, ' ').trim();
// (the short forms like MEGNEV, KISKAR, BRAR, CIKKSZ, MENNY are dBase field names, max. 10 letters)
const FIELD_SCORES = {
  name: (h) => (/^(megnevezes|megnev|cikknev|cnev|termeknev|termek neve|nev|nev1|name|termek|product)$/.test(h) ? 10
    : /megnev|cikknev|termeknev/.test(h) ? 9 : /\bnev\b|\bname\b/.test(h) ? 6 : /leiras|description/.test(h) ? 3 : 0),
  price: (h) => {
    if (/\bne\b|netto|nett|beszerz|ertek|afa|\batl\b/.test(h)) return 0;
    let s = 0;
    if (/kisker|kiskar/.test(h)) s += 6;
    if (/brutto|\bbr\b|^brar/.test(h)) s += 5;
    if (/elad/.test(h)) s += 3;
    if (/\bar\b|egysegar|price|kiskar|^brar|eladar|bruttoar/.test(h)) s += 3;
    return s;
  },
  sku: (h) => (/cikkszam|cikk szam|cikksz/.test(h) ? 10
    : /vonalkod|\bean\b|barcode|gtin/.test(h) ? 0 : /\bkod\b|cikkkod|cikkod|ckod|termekkod|\bcode\b|\bsku\b/.test(h) ? 6 : /azonosito/.test(h) ? 5 : 0),
  ean: (h) => (/vonalkod|\bean\b|barcode|gtin/.test(h) ? 10 : 0),
  // "Min. készlet" is a reorder level, not the stock on hand
  stock: (h) => (/ertek|\bert\b|\bar\b|\bmin\b|\bmax|teljes/.test(h) ? 0 : /keszlet|menny|^keszl|stock|\bqty\b|raktar/.test(h) ? 8 : 0),
  cat: (h) => (/cikkcsoport|\bcsoport\b/.test(h) ? 10 : /afa|ntak/.test(h) ? 0 : /kategoria|category/.test(h) ? 8 : 0),
  detail: (h) => (/kiegeszito/.test(h) ? 8 : 0),
  unit: (h) => (/^(egyseg|unit)$/.test(h) ? 8 : 0),
  drs: (h) => (h === 'drs' ? 8 : 0),
  min: (h) => (/^(min keszlet|minimum keszlet|min menny|minimum)$/.test(h) ? 8 : 0),
  full: (h) => (/^(teljes keszlet|max keszlet|maximum keszlet|maximalis keszlet)$/.test(h) ? 8 : 0),
  type: (h) => (/cikktipus|^tipus$/.test(h) ? 8 : 0),
  active: (h) => (/kassza hasznalja|^aktiv$/.test(h) ? 8 : 0),
};
const FIELD_ORDER = ['price', 'name', 'sku', 'ean', 'stock', 'cat', 'detail', 'unit', 'drs', 'type', 'active', 'min', 'full'];

function mapHeader(cells) {
  const heads = cells.map(headerNorm), used = new Set(), map = {};
  let total = 0;
  for (const field of FIELD_ORDER) {
    let best = -1, bestScore = 0;
    heads.forEach((h, i) => { const s = h ? FIELD_SCORES[field](h) : 0; if (s > bestScore && !used.has(i)) { best = i; bestScore = s; } });
    map[field] = best;
    if (best >= 0) { used.add(best); total += bestScore; }
  }
  return { map, score: map.name >= 0 || map.price >= 0 ? total : 0 };
}
function guessColumns(rows, ncols) {
  // No header: name = longest text column, price = first number column to its right, stock = the next one
  // (the POS item list is laid out Cikkszám | Megnevezés | Kisker ár | Készlet | Egység)
  const sample = rows.slice(0, 60);
  const stats = Array.from({ length: ncols }, (_, c) => {
    const vals = sample.map((r) => String(r[c] ?? '').trim()).filter(Boolean);
    const nums = vals.filter((v) => parseNumber(v) !== null);
    return { numeric: vals.length && nums.length / vals.length > 0.8, len: vals.reduce((a, v) => a + v.length, 0) / (vals.length || 1) };
  });
  let name = -1;
  stats.forEach((s, c) => { if (!s.numeric && (name < 0 || s.len > stats[name].len)) name = c; });
  let price = stats.findIndex((s, c) => s.numeric && c > name);
  if (price < 0) price = stats.findIndex((s) => s.numeric);
  const sku = name > 0 ? 0 : -1;
  const stock = price >= 0 ? stats.findIndex((s, c) => s.numeric && c > price) : -1;
  return { name, price, sku: sku === price ? -1 : sku, stock, cat: -1, detail: -1, unit: -1, drs: -1, ean: -1 };
}

// Two-line stock reports (like OfficeLine's "Aktuális shop készlet lista"): line 1 = Cikkszám | Mennyiség | … | Br.elad.egys.ár,
// line 2 = Cikknév | készletérték…, and group names (Alkohol, Dohány…) on lines of their own.
// Each item's two lines become one row, with its group name as Kategória.
function mergeTwoLineReport(rows) {
  const best = (r, field) => Math.max(0, ...r.map((c) => { const h = headerNorm(c); return h ? FIELD_SCORES[field](h) : 0; }));
  const h = rows.slice(0, 30).findIndex((r, i) => best(r, 'sku') >= 6 && best(r, 'name') < 6 && rows[i + 1] && best(rows[i + 1], 'name') >= 9);
  if (h < 0) return rows;
  const width = Math.max(rows[h].length, rows[h + 1].length);
  const pad = (r) => Array.from({ length: width }, (_, i) => r[i] ?? '');
  const key = (r) => r.map(headerNorm).join('|');
  const heads = new Set([key(rows[h]), key(rows[h + 1])]);
  const titles = new Set(rows.slice(0, h).map((r) => r.join(' ').trim()));
  const skuCol = Math.max(0, mapHeader(rows[h]).map.sku);
  const out = [[...pad(rows[h]), ...pad(rows[h + 1]), 'Kategória']];
  let cat = '';
  for (let i = h + 2; i < rows.length; i++) {
    const r = rows[i], filled = r.map((c) => String(c ?? '').trim()).filter(Boolean), code = String(r[skuCol] ?? '').trim();
    if (heads.has(key(r))) continue; // header repeated on every printed page
    if (filled.length >= 2 && /^[^\s:]+$/.test(code) && rows[i + 1]) {
      out.push([...pad(r), ...pad(rows[i + 1]), cat]);
      i++;
    } else if (filled.length === 1 && parseDecimal(filled[0]) === null && !titles.has(filled[0])
      && !/oldal|összesen|osszesen|lista|nyomtat|^\d{4}[.-]/i.test(filled[0])) cat = filled[0];
  }
  return out.length > 1 ? out : rows;
}

let imp = null;
const colLetter = (i) => (i >= 26 ? colLetter(Math.floor(i / 26) - 1) : '') + String.fromCharCode(65 + (i % 26));

// mode: 'daily' (prices and stock) or 'delivery' (also saves what was restocked as full); can be switched in the dialog
async function openImport(name, u8, mode = 'daily') {
  let rows;
  try {
    rows = mergeTwoLineReport((await fileRows(name, u8)).filter((r) => r.some((c) => String(c ?? '').trim())));
  } catch (e) {
    toast(t('importFail'));
    return;
  }
  if (!rows.length) { toast(t('noRows')); return; }
  const ncols = Math.max(...rows.slice(0, 200).map((r) => r.length));
  let headerRow = -1, best = { score: 0 };
  rows.slice(0, 15).forEach((r, i) => { const m = mapHeader(r); if (m.score > best.score) { best = m; headerRow = i; } });
  const map = headerRow >= 0 ? best.map : guessColumns(rows, ncols);
  imp = { name, rows, ncols, headerRow, detected: headerRow, map };

  $('#impFile').textContent = `${name} · ${t('rowsFound', { n: rows.length })}`;
  $('#impHeader').checked = headerRow >= 0;
  $('#impCat').value = '';
  $('#impOnlyUpdate').checked = false;
  $('#impReplace').checked = false;
  $('#impDelivery').checked = mode === 'delivery';
  $('#impDaily').checked = mode !== 'delivery';
  $('#impCols').open = map.name < 0 || map.price < 0; // columns only need a look when they weren't recognised
  fillImportSelects();
  $('#importDlg').showModal();
  updateImportPreview();
}
function fillImportSelects() {
  const head = imp.headerRow >= 0 ? imp.rows[imp.headerRow] : null;
  const firstData = imp.rows[imp.headerRow + 1] || [];
  const opts = Array.from({ length: imp.ncols }, (_, i) => {
    const h = head && String(head[i] ?? '').trim();
    const sample = String(firstData[i] ?? '').trim().slice(0, 28);
    const label = h ? `${h}${sample ? ` (${sample})` : ''}` : `${t('column')} ${colLetter(i)}${sample ? `: ${sample}` : ''}`;
    return `<option value="${i}">${esc(label)}</option>`;
  }).join('');
  const none = `<option value="-1">${esc(t('none'))}</option>`;
  [['#impName', 'name'], ['#impPrice', 'price'], ['#impSku', 'sku'], ['#impStock', 'stock']].forEach(([sel, field]) => {
    $(sel).innerHTML = none + opts;
    $(sel).value = String(imp.map[field] ?? -1);
  });
}
function importConfig() {
  const hasHeader = $('#impHeader').checked && imp.headerRow >= 0;
  const m = imp.map, extra = (k) => (hasHeader && m[k] >= 0 ? m[k] : -1);
  return {
    data: imp.rows.slice(imp.headerRow + 1),
    name: +$('#impName').value, price: +$('#impPrice').value, sku: +$('#impSku').value, stock: +$('#impStock').value,
    // extra columns are only trusted when they were recognised from a header row
    cat: extra('cat'), detail: extra('detail'), unit: extra('unit'), drs: extra('drs'), ean: extra('ean'),
    type: extra('type'), active: extra('active'), min: extra('min'), full: extra('full'),
    defCat: $('#impCat').value.trim(), onlyUpdate: $('#impOnlyUpdate').checked, replace: $('#impReplace').checked,
    delivery: $('#impDelivery').checked,
  };
}
// "… 0,5 l + DRS betétdíj 50 Ft" in the item name: the label gets the DRS line instead
const DRS_IN_NAME = /\s*\+?\s*\d?\s*\bDRS\b(\s*bet[ée]td[íi]j)?(\s*\d+\s*Ft)?\s*$/i;
const nameKey = (n) => norm(String(n).replace(DRS_IN_NAME, '').replace(/\s+/g, ' '));
// till items that never sit on a shelf (OfficeLine "Cikktípus"): e-vignettes, commissions, fuel, deposits, pump AdBlue
const NON_SHELF = /elektronikus|jutalek|uzemanyag|gongyoleg|adalek/;
// barcodes in a cell or field ("5999861370986", "5999861370986 4006381333931"); only real EAN/UPC numbers are kept
const parseCodes = (s) => [...new Set(String(s ?? '').split(/[\s,;/]+/).map(normCode).filter((c) => (c.length === 13 || c.length === 8) && eanValid(c)))];

function runImport(apply) {
  const cfg = importConfig();
  let products = apply ? state.products : state.products.map((p) => ({ ...p }));
  const bySku = new Map(), byName = new Map(), byCode = new Map(), seen = new Set();
  const index = (p) => {
    if (p.sku) bySku.set(norm(p.sku), p);
    if (!byName.has(nameKey(p.name))) byName.set(nameKey(p.name), p);
    codesOf(p).forEach((c) => byCode.set(c, p));
  };
  products.forEach(index);
  const cell = (r, i) => (i >= 0 ? String(r[i] ?? '').trim() : '');
  let add = 0, upd = 0, skip = 0, fresh = 0;
  const preview = [];
  for (const r of cfg.data) {
    let name = cell(r, cfg.name).replace(/\s+/g, ' ');
    const price = cfg.price >= 0 ? parseNumber(r[cfg.price]) : null;
    // no name, no price or 0 Ft (loyalty points, coupons, crates), switched off at the till, or not a shelf item
    if (!name || !price || /^(0|nem|n|false|hamis)$/i.test(cell(r, cfg.active)) || NON_SHELF.test(norm(cell(r, cfg.type)))) {
      skip++;
      continue;
    }
    const sku = cell(r, cfg.sku), cat = cell(r, cfg.cat), codes = parseCodes(cell(r, cfg.ean)), extra = {};
    const stock = cfg.stock >= 0 ? parseDecimal(r[cfg.stock]) : null;
    if (stock !== null) extra.stock = stock;
    const min = cfg.min >= 0 ? parseDecimal(r[cfg.min]) : null;
    if (min > 0) extra.min = min; // an empty or 0 “Min. készlet” keeps the level set in the app
    const full = cfg.full >= 0 ? parseDecimal(r[cfg.full]) : null;
    if (full > 0) extra.full = full;
    if (cfg.detail >= 0) extra.detail = cell(r, cfg.detail);
    if (cfg.unit >= 0 && UNITS.includes(cell(r, cfg.unit))) extra.unit = cell(r, cfg.unit);
    if (cfg.drs >= 0) extra.drs = /^(1|i|igen|y|yes|true|x)$/i.test(cell(r, cfg.drs));
    else if (DRS_IN_NAME.test(name) && name.replace(DRS_IN_NAME, '')) { name = name.replace(DRS_IN_NAME, ''); extra.drs = true; }
    if (preview.length < 5) preview.push({ name, price, drs: !!extra.drs });
    let p = (sku && bySku.get(norm(sku))) || codes.map((c) => byCode.get(c)).find(Boolean) || byName.get(nameKey(name));
    if (p && sku && p.sku && norm(p.sku) !== norm(sku)) p = null; // same name, different item number: a separate product
    if (p) seen.add(p);
    if (p) {
      upd++;
      // fresh delivery: stock that went up since the last file is what this product looks like full
      // (like "Full now", but only for what was restocked); unwatched products get a suggested order amount
      if (cfg.delivery && stock !== null && hasStock(p) && stock > p.stock) {
        fresh++;
        extra.full = stock;
        if (extra.min === undefined && levelOf(p) === null) extra.min = suggestMin(stock);
      }
      if (apply) {
        p.price = price;
        if (sku && !p.sku) p.sku = sku;
        if (cat) p.cat = cat; // the office's item group wins
        if (codes.length) p.codes = [...new Set([...codesOf(p), ...codes])]; // codes linked in the app stay
        Object.assign(p, extra);
      }
    } else if (cfg.onlyUpdate) skip++;
    else {
      add++;
      p = { id: uid(), cat: cat || cfg.defCat, name, detail: '', price, unit: '', drs: false, sku, ...extra };
      if (codes.length) p.codes = codes;
      products.push(p);
      index(p);
      seen.add(p);
    }
  }
  // "delete what's not in the file": matched products keep their id, so labels and "don't order" marks survive
  const del = cfg.replace ? products.filter((p) => !seen.has(p)).length : 0;
  if (cfg.replace) products = products.filter((p) => seen.has(p));
  if (apply) state.products = products;
  return { add, upd, skip, del, fresh, preview };
}
function updateImportPreview() {
  const r = runImport(false);
  $('#impModeHint').textContent = t($('#impDelivery').checked ? 'modeDeliveryHint' : 'modeDailyHint');
  $('#impPreview').innerHTML = r.preview.map((p) => `<li><span>${esc(p.name)}${p.drs ? ' · DRS' : ''}</span><b>${esc(priceText(p))}</b></li>`).join('');
  $('#impPreview').hidden = !r.preview.length;
  $('#impSummary').textContent = t('impSummary', r);
  $('#impGo').disabled = !(r.add + r.upd);
}
const IMPORT_SELECTS = { impName: 'name', impPrice: 'price', impSku: 'sku', impStock: 'stock' };
$('#importForm').addEventListener('change', (e) => {
  if (IMPORT_SELECTS[e.target.id]) imp.map[IMPORT_SELECTS[e.target.id]] = +e.target.value;
  if (e.target.id === 'impHeader') {
    imp.headerRow = e.target.checked ? Math.max(0, imp.detected) : -1;
    if (e.target.checked && imp.detected < 0) {
      const m = mapHeader(imp.rows[0]).map;
      for (const k in m) if (m[k] >= 0) imp.map[k] = m[k];
    }
    fillImportSelects();
  }
  if (e.target.id === 'impOnlyUpdate' && e.target.checked) $('#impReplace').checked = false;
  if (e.target.id === 'impReplace' && e.target.checked) $('#impOnlyUpdate').checked = false;
  updateImportPreview();
});
$('#importForm').addEventListener('input', (e) => { if (e.target.id === 'impCat') updateImportPreview(); });
$('#impCancel').onclick = () => $('#importDlg').close();
$('#importForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const before = JSON.stringify({ products: state.products, sheet: state.sheet, lastImport: state.lastImport });
  const r = runImport(true);
  state.lastImport = { name: imp.name, at: Date.now() };
  // labels already on the sheet pick up new prices
  const byId = new Map(state.products.map((p) => [p.id, p]));
  state.sheet.forEach((it) => { const p = it.pid && byId.get(it.pid); if (p) it.price = p.price; });
  $('#importDlg').close();
  prodFilter.q = ''; prodFilter.cat = null; $('#prodSearch').value = '';
  changed();
  toast(t('imported', r), t('undo'), () => { Object.assign(state, JSON.parse(before)); changed(); });
});

// a picked or shared file: a backup made by the app is restored, anything else is imported as a product list
let importMode = 'daily';
function pickImport(mode) {
  importMode = mode;
  $('#importInput').value = '';
  $('#importInput').click();
}
function openFile(name, u8, mode) {
  const backup = backupOf(u8);
  if (backup) restoreBackup(backup);
  else if (mode === 'restore') toast(t('notBackup'));
  else openImport(name, u8, mode);
}
$('#importInput').addEventListener('change', async (e) => {
  const f = e.target.files && e.target.files[0];
  if (f) openFile(f.name, new Uint8Array(await f.arrayBuffer()), importMode);
});
// Files opened with / shared to the app ("Open with Price Labels" on an email attachment)
window.onAppFile = () => {
  if (!isApp || !window.Android.hasPendingFile()) return;
  const name = window.Android.pendingFileName();
  const bin = atob(window.Android.takePendingFile());
  const u8 = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  closeScanner();
  showTab('products');
  openFile(name, u8, 'daily');
};

const CSV_HEAD = ['Cikkszám', 'Megnevezés', 'Kiegészítő szöveg', 'Ár', 'Készlet', 'Egység', 'Kategória', 'DRS', 'Min. készlet', 'Teljes készlet', 'Vonalkód'];
function productsCsv() {
  const q = (v) => { const s = String(v ?? ''); return /[;"\r\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const lines = [CSV_HEAD.join(';')];
  for (const p of state.products) {
    lines.push([p.sku, p.name, p.detail, p.price ?? '', hasStock(p) ? fmtQty(p.stock) : '', p.unit, p.cat, p.drs ? 'igen' : '',
      typeof p.min === 'number' ? fmtQty(p.min) : '', typeof p.full === 'number' ? fmtQty(p.full) : '', codesOf(p).join(' ')].map(q).join(';'));
  }
  return '﻿' + lines.join('\r\n') + '\r\n'; // BOM + ';' so Hungarian Excel opens it correctly
}
function exportProducts() {
  const bytes = new TextEncoder().encode(productsCsv());
  const name = fileName().replace('arcimke-', 'termekek-').replace(/\.pdf$/, '.csv');
  if (isApp) window.Android.shareFile(toBase64(bytes), name, 'text/csv', 'share', '', t('tabProducts'));
  else downloadBytes(bytes, name, 'text/csv');
}

$('#editForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const fields = editItem();
  if (!fields.name && fields.price === null) { toast(t('needName')); return; }
  let saved = null;
  if (editing.kind === 'sheet') {
    const it = state.sheet.find((x) => x.id === editing.id);
    if (it) Object.assign(it, fields, { copies: editCopies });
  } else {
    let p = editing.kind === 'new' ? { id: uid() } : state.products.find((x) => x.id === editing.id);
    if (p) {
      Object.assign(p, fields, { cat: E.cat.value.trim() });
      const stock = parseDecimal(E.stock.value);
      if (stock === null) delete p.stock; else p.stock = stock;
      if ($('#eNoOrder').checked) p.noOrder = true; else delete p.noOrder;
      const min = parseDecimal(E.min.value);
      if (min === null) delete p.min; else p.min = min;
      const full = parseDecimal(E.full.value);
      if (full === null) delete p.full; else p.full = full;
      const sku = E.sku.value.trim();
      if (sku) p.sku = sku; else delete p.sku;
      const codes = parseCodes(E.codes.value);
      if (codes.length) p.codes = codes; else delete p.codes;

$('#eDelete').onclick = () => {
  $('#editDlg').close();

    const idx = state.sheet.findIndex((x) => x.id === editing.id);
    if (idx >= 0) removeSheetItem(idx);
  } else {
    const idx = state.products.findIndex((x) => x.id === editing.id);
    if (idx < 0) return;
    const [p] = state.products.splice(idx, 1);

    toast(t('removed'), t('undo'), () => { state.products.splice(idx, 0, p); changed(); });
  }

  const idOf = (s) => s.getVideoTracks()[0].getSettings().deviceId;
  const close = (s) => s.getTracks().forEach((tr) => tr.stop());

  if (saved) {
    try { return await open(saved); } catch (e) { /* that camera is gone: choose again */ }
  }

      cams = (await md.enumerateDevices())
        .filter((d) => d.kind === 'videoinput' && d.deviceId && /back|rear|environment/i.test(d.label))

async function startCamera() {

async function scanFrame() {

  if (act === 'new') { openEditor('new', { codes: [scan.code] }, (np) => showScanProduct(np)); return; }
  if (!p) return;
  if (act === 'inc' || act === 'dec') {
    const v = (hasStock(p) ? p.stock : 0) + (act === 'inc' ? 1 : -1);
    setScanStock(p, v);
    $('#scStock').value = fmtQty(p.stock);
  } else if (act === 'full') {
    if (!hasStock(p) || p.stock <= 0) return;
    p.full = p.stock;
    if (levelOf(p) === null) p.min = suggestMin(p.stock);
    scan.dirty = true;
    save();
    $('#scState').innerHTML = scanStateHtml(p);
    toast(t('fullSetOne'));
  } else if (act === 'label') {
    addToSheet(p, 1, p.id);
    scan.dirty = true;
    save();
    renderSheet();
    const n = state.sheet.filter((it) => it.pid === p.id).reduce((a, it) => a + it.copies, 0);
    $('#scLabel').textContent = `+ ${t('addLabel')} (${n})`;
    toast(t('added'));
  } else if (act === 'edit') {
    openEditor('product', p, (sp) => showScanProduct(sp));
  } else if (act === 'unlink') {
    p.codes = codesOf(p).filter((c) => c !== scan.code);
    if (!p.codes.length) delete p.codes;
    scan.dirty = true;
    save();
    toast(t('unlinked'));
    showScanUnknown(scan.code);
  }
});
$('#scanSheet').addEventListener('input', (e) => {
  if (e.target.id === 'scStock') { const p = scanProduct(); if (p) setScanStock(p, parseDecimal(e.target.value)); }
  if (e.target.id === 'scFind') renderScanResults();
});
$('#scanSheet').addEventListener('keydown', (e) => {
  if (e.key !== 'Enter') return;
  if (e.target.id === 'scManual') { e.preventDefault(); manualCode(); }
  if (e.target.id === 'scStock') e.target.blur();
});

// ---------- backup / restore ----------
// Everything the app keeps (products, labels, settings) in one JSON file in Downloads/Arcimke, which stays on the
// phone even if the app is uninstalled. Opening the file with the app, or picking it under Restore, brings it back.
function saveBackup(silent) {
  const bytes = new TextEncoder().encode(JSON.stringify({ app: 'price-labels', backup: 1, at: Date.now(), state }));
  const name = fileName().replace('arcimke-', 'arcimke-mentes-').replace(/\.pdf$/, '.json');
  if (!isApp) { downloadBytes(bytes, name, 'application/json'); return true; }
  const r = String(window.Android.saveFile(toBase64(bytes), name, 'application/json'));
  if (r.startsWith('ok:')) { if (!silent) toast(t('backupSaved', { path: r.slice(3) })); return true; }
  toast(r.replace(/^err:/, ''));
  return false;
}
function backupOf(u8) {
  const start = u8[0] === 0xEF ? 3 : 0; // UTF-8 BOM
  if (u8[start] !== 0x7B || u8.length > 30 * 1024 * 1024) return null; // not "{"
  try {
    const data = JSON.parse(new TextDecoder().decode(u8));
    return data && data.app === 'price-labels' && data.state && Array.isArray(data.state.products) ? data : null;
  } catch (e) { return null; }
}
async function restoreBackup(data) {
  if (!await ask(t('restoreTitle'), t('restoreText', { n: data.state.products.length, when: fmtWhen(data.at) }), t('restoreOk'))) return;
  const before = state;
  const apply = (s) => { state = s; layoutCache.clear(); applyI18n(); changed(); };
  apply(migrate(data.state));
  toast(t('restored', { n: state.products.length }), t('undo'), () => apply(before));
}
$('#mBackup').onclick = () => saveBackup(false);
$('#mRestore').onclick = () => pickImport('restore');

// ---------- updates from GitHub ----------
// When there is internet the app looks at the latest release of its GitHub repository (at most every 6 hours, or
// when asked) and offers to install it. The new APK has the same package name and signature, so Android installs
// it over this one and keeps all data. Offline the check is simply skipped.
const REPO = 'Plyxen/price-labels';
const RELEASES_API = `https://api.github.com/repos/${REPO}/releases/latest`;
const UPDATE_KEY = 'arcimke.update';
const upd = { state: 'idle', latest: null, url: null, pct: 0, msg: '', timer: 0 };
function appVersion() {
  if (!isApp || !window.Android.appVersion) return null;
  const [name, code] = String(window.Android.appVersion()).split('|');
  return { name, code: +code };
}
function newerThan(a, b) {
  const x = String(a).split('.').map((n) => parseInt(n, 10) || 0), y = String(b).split('.').map((n) => parseInt(n, 10) || 0);
  for (let i = 0; i < Math.max(x.length, y.length); i++) if ((x[i] || 0) !== (y[i] || 0)) return (x[i] || 0) > (y[i] || 0);
  return false;
}
function updateInfo() { try { return JSON.parse(localStorage.getItem(UPDATE_KEY)) || {}; } catch (e) { return {}; } }
function checkUpdate(manual) {
  if (!appVersion() || !window.Android.checkUpdate) { if (manual) { upd.state = 'web'; renderUpdate(); } return; }
  if (!manual && Date.now() - (updateInfo().at || 0) < 6 * 3600 * 1000) { knownUpdate(false); return; }
  if (!navigator.onLine) { if (manual) { upd.state = 'offline'; renderUpdate(); } return; }
  if (upd.state === 'download' || upd.state === 'install') return;
  upd.state = 'checking';
  renderUpdate();
  clearTimeout(upd.timer);
  // the app only calls back when GitHub answered
  upd.timer = setTimeout(() => { if (upd.state === 'checking') { upd.state = manual ? 'offline' : 'idle'; renderUpdate(); } }, 20000);
  window.Android.checkUpdate(RELEASES_API);
}
window.onUpdateJson = (json) => {
  clearTimeout(upd.timer);
  let rel = null;
  try { rel = JSON.parse(json); } catch (e) { /* ignored below */ }
  if (!rel || !rel.tag_name) { upd.state = 'idle'; renderUpdate(); return; }
  // only an APK attached to a release of this repository is downloaded
  const asset = (rel.assets || []).find((a) => /\.apk$/i.test(a.name || '')
    && String(a.browser_download_url || '').startsWith(`https://github.com/${REPO}/releases/download/`));
  const info = { at: Date.now(), version: String(rel.tag_name).replace(/^v/i, ''), url: asset ? asset.browser_download_url : null };
  try { localStorage.setItem(UPDATE_KEY, JSON.stringify(info)); } catch (e) { /* storage unavailable */ }
  knownUpdate(true);
};
function knownUpdate(checked) {
  const info = updateInfo(), me = appVersion();
  if (me && info.version && info.url && newerThan(info.version, me.name)) {
    const first = upd.latest !== info.version;
    Object.assign(upd, { state: 'available', latest: info.version, url: info.url });
    if (first) toast(t('updToast', { v: info.version }), t('updInstall'), installUpdate);
  } else if (checked) upd.state = 'latest';
  renderUpdate();
}
function renderUpdate() {
  const me = appVersion(), info = updateInfo(), s = upd.state;
  $('#verText').textContent = me ? t('version', { v: `${me.name} (${me.code})` }) : t('updWeb');
  $('#updTitle').textContent = s === 'available' ? t('updAvail', { v: upd.latest }) : t('updCheck');
  $('#updSub').textContent = {
    checking: t('updChecking'), latest: t('updLatest'), offline: t('updOffline'), web: t('updWeb'), available: t('updTapInstall'),
    download: t('updDownloading', { p: upd.pct }), install: t('updInstalling'), error: t('updFailed', { m: upd.msg }),
  }[s] || (info.at ? t('updLast', { when: fmtWhen(info.at) }) : t('updNever'));
  $('#updBanner').hidden = !['available', 'download', 'install'].includes(s);
  $('#updBannerTitle').textContent = s === 'download' ? t('updDownloading', { p: upd.pct }) : t('updAvail', { v: upd.latest });
  $('#updBannerBtn').disabled = s !== 'available';
  $('#moreDot').hidden = !['available', 'download', 'install'].includes(s);
}
async function installUpdate() {
  if (!appVersion() || !upd.url || upd.state === 'download') return;
  if (!window.Android.canInstall()) { // Android's "Install unknown apps" switch, asked for once
    if (await ask(t('updAllowTitle'), t('updAllowText'), t('openSettings'))) window.Android.allowInstall();
    return;
  }
  saveBackup(true); // a copy of everything in Downloads first, just in case
  Object.assign(upd, { state: 'download', pct: 0 });
  renderUpdate();
  window.Android.installUpdate(upd.url);
}
window.onUpdateState = (s, v) => {
  if (s === 'download') upd.pct = Math.max(0, v | 0);
  if (s === 'error') upd.msg = String(v || '');
  upd.state = s;
  // the installer is on screen now; if it's cancelled, the update can be started again
  if (s === 'install') setTimeout(() => { if (upd.state === 'install') { upd.state = 'available'; renderUpdate(); } }, 8000);
  renderUpdate();
};
$('#mUpdate').onclick = () => (upd.state === 'available' ? installUpdate() : checkUpdate(true));
$('#updBannerBtn').onclick = () => installUpdate();
window.addEventListener('online', () => checkUpdate(false));

// ---------- Android back button ----------
window.onAndroidBack = () => {
  const open = [...$$('dialog[open]')].pop(); // the one on top
  if (open) { open.close(); return true; }
  if (!$('#prodMenu').hidden) { closeMenu(); return true; }
  if (!$('#scanView').hidden) { closeScanner(); return true; }
  if (currentTab === 'products' && prodFilter.amounts) { setAmounts(false); return true; }
  if (currentTab !== 'products') { showTab('products'); return true; }
  return false;
};

function renderAll() {
  renderSheet();
  renderProducts();
  renderOrder();
  if (currentTab === 'labels') renderPreview();
  if (currentTab === 'more') renderMore();
  if ($('#labelDlg').open) renderLive();
}
let resizeTimer;
window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(renderAll, 150); });

applyI18n();
F.name.placeholder = 'Jim Beam Whisky';
showTab('products');
renderAll();
window.onAppFile();
checkUpdate(false);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { layoutCache.clear(); renderAll(); });
</script>
