<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Árcímke</title>
<style>
:root{
  --inset-top: env(safe-area-inset-top, 0px);
  --inset-bottom: env(safe-area-inset-bottom, 0px);
  --bg:#f3f5f8; --surface:#ffffff; --surface-2:#eef1f5; --text:#111827; --muted:#667085; --line:#e2e6ec;
  --accent:#1f5eff; --accent-press:#1a4fd6; --accent-soft:#e7eeff;
  --danger:#d32f2f; --danger-soft:#fdecec; --warn:#a15c00; --warn-soft:#fff3dc; --ok:#15803d; --ok-soft:#e5f6ea;
  --shadow:0 1px 2px rgba(16,24,40,.05), 0 1px 3px rgba(16,24,40,.07);
  --shadow-lg:0 6px 20px rgba(16,24,40,.20);
  --radius:16px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0b0f17; --surface:#151b26; --surface-2:#1c2431; --text:#e8ecf2; --muted:#9aa4b2; --line:#283244;
    --accent:#5c8bff; --accent-press:#4a78ea; --accent-soft:#1b2944;
    --danger:#ff6b6b; --danger-soft:#3a1a1c; --warn:#f5b942; --warn-soft:#352a12; --ok:#4ade80; --ok-soft:#12301d;
    --shadow:none; --shadow-lg:0 6px 20px rgba(0,0,0,.55);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);
  display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;font-size:16px;line-height:1.35}
button{font:inherit;color:inherit;cursor:pointer}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.sm{width:20px;height:20px}
[hidden]{display:none !important}

/* top app bar: title and the current tab's actions */
header.top{background:var(--bg);padding:calc(var(--inset-top) + 6px) 4px 4px 20px;display:flex;align-items:center;gap:2px;flex:none}
header.top h1{font-size:22px;margin:0;flex:1;min-width:0;font-weight:750;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:48px}
.icon-btn{width:48px;height:48px;border:0;border-radius:24px;background:none;display:grid;place-items:center;color:var(--text);flex:none;position:relative}
.icon-btn:active{background:var(--surface-2)}
.icon-btn.on{background:var(--accent-soft);color:var(--accent)}

main{flex:1;overflow-y:auto;overscroll-behavior:contain}
.tab{display:none;padding:4px 16px 32px;max-width:640px;margin:0 auto}
.tab.active{display:block}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.field{display:block;margin-bottom:12px}
.field>span{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:600}
input[type=text],input[type=search],input[type=email],input:not([type]),select{
  width:100%;height:50px;border:1.5px solid var(--line);border-radius:12px;padding:0 14px;font-size:17px;
  background:var(--surface-2);color:var(--text);outline:none;font-family:inherit;-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 20px) 22px,calc(100% - 15px) 22px;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
input:focus,select:focus{border-color:var(--accent);background-color:var(--surface)}
.price-wrap{position:relative}
.price-wrap::after{content:"Ft";position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:700;pointer-events:none}
.price-wrap input{padding-right:44px;font-weight:700;font-size:20px;font-variant-numeric:tabular-nums}
.row{display:flex;gap:10px;align-items:flex-end}
.row>.grow{flex:1;min-width:0}
.row>.unit{width:118px;flex:none}
.check{display:flex;align-items:center;gap:10px;min-height:44px;font-size:15px}
.check input{width:22px;height:22px;margin:0;accent-color:var(--accent);flex:none}
.split{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px;flex-wrap:wrap}
.copies{display:flex;align-items:center;gap:10px;font-size:15px}

.stepper{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface-2);flex:none}
.stepper button{width:44px;height:44px;border:0;background:none;font-size:22px;line-height:1}
.stepper button:active{background:var(--line)}
.stepper .n{min-width:30px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}

.primary{width:100%;height:54px;border:0;border-radius:14px;background:var(--accent);color:#fff;font-size:17px;font-weight:700;
  display:flex;align-items:center;justify-content:center;gap:8px}
.primary:active{background:var(--accent-press)}
.primary:disabled{opacity:.45}

.label-preview{width:100%;aspect-ratio:70/30;display:block;border-radius:4px;background:#fff;margin:0 0 14px;
  box-shadow:0 0 0 1px var(--line),0 3px 10px rgba(0,0,0,.08)}

.suggest{margin:-6px 0 12px;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.suggest button{display:flex;width:100%;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;border:0;
  border-top:1px solid var(--line);background:none;text-align:left}
.suggest button:first-child{border-top:0}
.suggest button:active{background:var(--surface-2)}
.suggest small{color:var(--muted)}
.suggest b{white-space:nowrap;font-variant-numeric:tabular-nums}

.list-head{display:flex;align-items:center;gap:6px;margin:18px 4px 6px;min-height:44px}
.list-head h2{font-size:13px;margin:0;font-weight:750;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.list-head .muted{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.muted{color:var(--muted);font-size:14px}
.text-btn{border:0;background:none;color:var(--accent);font-weight:700;font-size:15px;padding:10px 8px;min-height:44px;border-radius:10px;white-space:nowrap;flex:none}
.text-btn:active{background:var(--accent-soft)}
.text-btn.danger{color:var(--danger)}

ul.list{list-style:none;padding:0;margin:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
.item{display:flex;align-items:center;gap:6px;padding:4px 10px 4px 2px;border-top:1px solid var(--line);min-height:66px}
.item:first-child{border-top:0}
.item-main{flex:1;min-width:0;text-align:left;background:none;border:0;padding:10px 10px;border-radius:10px}
.item-main:active{background:var(--surface-2)}
.nm{display:block;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{display:block;font-size:13.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.price{font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums;font-size:15px}
.add{width:48px;height:48px;border-radius:12px;border:0;background:var(--accent-soft);color:var(--accent);font-size:26px;font-weight:500;position:relative;flex:none;line-height:1}
.add:active{filter:brightness(.92)}
.bc{width:40px;height:48px;border:0;border-radius:12px;background:none;color:var(--muted);display:grid;place-items:center;flex:none}
.bc:active{background:var(--surface-2)}
.add .cnt{position:absolute;top:-5px;right:-5px;background:var(--accent);color:#fff;font-size:11px;font-weight:700;min-width:20px;height:20px;border-radius:10px;padding:0 5px;line-height:20px}
.add.no{background:var(--surface-2);color:var(--muted);font-size:20px}
.empty{padding:32px 20px;text-align:center;color:var(--muted);font-size:15px}
.empty b{display:block;color:var(--text);font-size:17px;margin-bottom:6px}
.empty small{display:block;margin-top:8px;font-size:13.5px}
.empty-acts{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:18px}
.empty-acts .btn{height:48px;width:100%;max-width:280px}
.group{padding:12px 14px 6px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--surface-2);
  border-top:1px solid var(--line);display:flex;align-items:center;gap:8px}
.group:first-child{border-top:0}
.group .gname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.group.amts{padding-right:10px;gap:6px}
.group .colh{width:58px;text-align:center;flex:none;font-size:11px}
.gbtn{flex:none;height:30px;padding:0 12px;border-radius:15px;border:1.5px solid var(--line);background:var(--surface);color:var(--muted);font-size:12px;font-weight:700;letter-spacing:0;text-transform:none}
.item input.amt{width:58px;height:42px;padding:0 4px;text-align:center;font-size:16px;flex:none}
.hidden-note{padding:14px;border-top:1px solid var(--line);color:var(--muted);font-size:14px;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.hidden-note .gbtn{color:var(--text)}
.more{padding:12px;text-align:center;border-top:1px solid var(--line)}
.sec{padding:14px 14px 6px;font-size:15px;font-weight:800;border-top:1px solid var(--line)}
.sec:first-child{border-top:0}
.sec.order,.stk.order{color:var(--danger)}
.sec.low{color:var(--warn)}
.stk.order,.stk.low,.stk.out{font-weight:700}
.stk.low{color:var(--warn)}
.stk.out{color:var(--danger)}

/* search + group chips stay at the top while the list scrolls */
.search-bar{position:sticky;top:0;z-index:2;background:var(--bg);margin:0 -16px;padding:4px 16px 0}
.search{position:relative}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search input{padding-left:46px;border-radius:25px;background:var(--surface);border-color:var(--line)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:0 15px;border-radius:18px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:14px}
.chip.active{background:var(--text);color:var(--bg);border-color:var(--text)}
/* the count keeps room for itself; the buttons move to a second line on narrow phones */
#tab-products .list-head{flex-wrap:wrap;justify-content:flex-end;row-gap:0;margin-top:2px}
#prodCount{flex:1 1 auto;min-width:100px}
.amt-hint{margin:6px 4px 10px;font-size:13.5px;color:var(--muted);background:var(--accent-soft);border-radius:12px;padding:10px 12px}

/* order tab */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{border-radius:14px;padding:12px 14px;background:var(--surface-2)}
.stat b{display:block;font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:13.5px;font-weight:650;color:var(--muted)}
.stat.order{background:var(--danger-soft)} .stat.order b{color:var(--danger)}
.stat.low{background:var(--warn-soft)} .stat.low b{color:var(--warn)}
.card-foot{display:flex;align-items:center;justify-content:center;gap:4px;margin:8px -6px -8px;flex-wrap:wrap}

/* labels tab */
.sum-line{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin:0 2px 12px}
.sum-line b{font-size:18px}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.actions .primary{grid-column:1/-1}
.act{height:62px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);font-weight:650;font-size:13.5px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.act:active{background:var(--surface-2)}
.act:disabled{opacity:.45}
.pages{display:grid;gap:18px}
figure.page{margin:0}
figure.page canvas{width:100%;display:block;background:#fff;border-radius:2px;box-shadow:0 0 0 1px var(--line),0 4px 14px rgba(0,0,0,.10)}
figcaption{text-align:center;font-size:13px;color:var(--muted);margin-top:6px}
.hint{font-size:13.5px;color:var(--muted);margin:16px 4px 0}

/* more tab */
.sec-title{font-size:13px;font-weight:750;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:22px 6px 8px}
.sec-title:first-child{margin-top:8px}
.menu-card{padding:4px 0;overflow:hidden}
.row-btn{display:flex;align-items:center;gap:14px;width:100%;min-height:64px;padding:10px 14px 10px 16px;border:0;border-top:1px solid var(--line);background:none;text-align:left}
.menu-card>.row-btn:first-child,.menu-card>.db-sum+.row-btn{border-top:0}
.row-btn:not(.static):active{background:var(--surface-2)}
.row-btn .ri{width:40px;height:40px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.row-btn .ri.warm{background:var(--ok-soft);color:var(--ok)}
.row-btn .rt{flex:1;min-width:0}
.row-btn .rt b{display:block;font-weight:650}
.row-btn .rt small{display:block;color:var(--muted);font-size:13.5px;margin-top:2px}
.row-btn .chev{color:var(--muted)}
.menu-card .pad{padding:8px 16px 4px;border-top:1px solid var(--line)}
.db-sum{margin:0;padding:12px 16px 14px;font-size:14px;color:var(--muted);line-height:1.5;border-bottom:1px solid var(--line)}
.db-sum b{color:var(--text)}
.banner{display:flex;align-items:center;gap:12px;background:var(--accent-soft);border-radius:var(--radius);padding:12px 12px 12px 16px;margin:8px 0 4px}
.banner .grow{flex:1;min-width:0}
.banner b{display:block}
.banner small{display:block;color:var(--muted);font-size:13.5px}
.banner .btn.primary{height:44px;padding:0 18px}

/* bottom navigation, with the scanner in the middle */
nav.bottom{flex:none;display:flex;background:var(--surface);border-top:1px solid var(--line);padding-bottom:var(--inset-bottom)}
nav.bottom button{flex:1;min-width:0;height:68px;border:0;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;font-weight:650;position:relative;padding:0}
nav.bottom .pill{width:56px;height:30px;border-radius:15px;display:grid;place-items:center;transition:background-color .15s}
nav.bottom button.active{color:var(--text)}
nav.bottom button.active .pill{background:var(--accent-soft);color:var(--accent)}
nav.bottom .scan-c{width:58px;height:46px;border-radius:16px;background:var(--accent);color:#fff;display:grid;place-items:center;box-shadow:0 3px 10px rgba(31,94,255,.35)}
nav.bottom .scan-btn{color:var(--text);gap:2px}
nav.bottom .scan-btn:active .scan-c{background:var(--accent-press)}
nav.bottom .badge{position:absolute;top:6px;left:calc(50% + 8px);background:var(--accent);color:#fff;font-size:11px;font-weight:700;min-width:19px;height:19px;border-radius:10px;padding:0 5px;line-height:19px}
nav.bottom .badge.warn{background:var(--danger)}
nav.bottom .dot{position:absolute;top:8px;left:calc(50% + 14px);width:10px;height:10px;border-radius:5px;background:var(--danger);border:2px solid var(--surface)}
html.kb nav.bottom{display:none}

/* overflow menu of the app bar */
.menu{position:fixed;top:calc(var(--inset-top) + 52px);right:8px;z-index:12;min-width:230px;max-width:calc(100% - 16px);background:var(--surface);border-radius:14px;
  box-shadow:var(--shadow-lg);border:1px solid var(--line);padding:6px 0}
.menu button{display:flex;align-items:center;gap:14px;width:100%;min-height:50px;padding:0 18px;border:0;background:none;text-align:left;font-size:15.5px}
.menu button:active{background:var(--surface-2)}
.menu svg{color:var(--muted)}
.menu-scrim{position:fixed;inset:0;z-index:11}

dialog{border:0;padding:0;width:100%;max-width:560px;margin:auto auto 0;border-radius:22px 22px 0 0;background:var(--surface);color:var(--text);
  max-height:92vh;max-height:92dvh;overflow-y:auto}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog form{padding:20px 18px calc(16px + var(--inset-bottom))}
dialog h2{margin:0 0 14px;font-size:19px}
.sheet-head{display:flex;align-items:center;gap:8px;margin:-6px -8px 10px 0}
.sheet-head h2{flex:1;margin:0}
dialog.center{margin:auto;border-radius:22px;max-width:420px;width:calc(100% - 32px)}
/* a barcode for the register's scanner: black on white whatever the theme, the whole screen */
dialog.code{max-width:none;width:100%;height:100%;max-height:none;margin:0;border-radius:0;background:#fff;color:#111}
dialog.code::backdrop{background:#fff}
.code-view{min-height:100%;display:flex;flex-direction:column;padding:calc(var(--inset-top) + 6px) 16px calc(var(--inset-bottom) + 20px)}
.code-view .icon-btn{color:#111;align-self:flex-start}
.code-main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding-bottom:40px}
.code-name{font-size:20px;font-weight:750;line-height:1.25;max-width:100%;overflow-wrap:anywhere}
.code-price{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;margin:4px 0 22px}
#codeCanvas{display:block}
.code-digits{font:600 22px/1.2 ui-monospace,Consolas,monospace;letter-spacing:.14em;margin-top:6px}
.code-pick{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:18px}
.code-pick button{height:36px;padding:0 12px;border-radius:18px;border:1.5px solid #ccc;background:#fff;color:#111;font-weight:650;font-variant-numeric:tabular-nums}
.code-pick button.on{border-color:#111;background:#111;color:#fff}
.code-hint{color:#555;font-size:14px;line-height:1.4;margin:24px 8px 0;max-width:400px}
.code-btn{width:100%;height:44px;margin:0 0 12px}
dialog.center form{padding:22px 20px 16px}
.dlg-actions{display:flex;gap:10px;align-items:center;margin-top:10px}
.dlg-actions .grow{flex:1}
.btn{height:50px;padding:0 18px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:active{background:var(--surface-2)}
.btn.primary{width:auto;border:0;padding:0 24px;height:50px;background:var(--accent);color:#fff}
.btn.primary:active{background:var(--accent-press)}
.small{font-size:12.5px}
.added-note{margin:10px 2px 0;color:var(--ok);font-weight:650;font-size:14.5px;min-height:20px}

.seg{display:flex;background:var(--surface-2);border-radius:14px;padding:4px;gap:4px;margin:0 0 8px}
.seg label{flex:1;position:relative;min-width:0}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:flex;align-items:center;justify-content:center;gap:6px;min-height:46px;border-radius:10px;font-weight:700;font-size:14.5px;color:var(--muted);text-align:center;padding:4px 8px;line-height:1.2}
.seg input:checked+span{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.mode-hint{font-size:13.5px;color:var(--muted);margin:0 2px 12px}
details.adv{border:1px solid var(--line);border-radius:12px;margin:8px 0;padding:0 12px}
details.adv summary{min-height:48px;display:flex;align-items:center;font-weight:650;font-size:15px;cursor:pointer;list-style:none}
details.adv summary::-webkit-details-marker{display:none}
details.adv summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin:-4px 4px 0 auto;transition:transform .15s}
details.adv[open] summary::after{transform:rotate(-135deg);margin-top:4px}
details.adv[open]{padding-bottom:6px}
.imp-file{margin:-6px 0 14px;font-size:14px;color:var(--muted);word-break:break-all}
.imp-prev{list-style:none;margin:4px 0 8px;padding:0;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.imp-prev li{display:flex;justify-content:space-between;gap:12px;padding:9px 12px;border-top:1px solid var(--line);font-size:14px}
.imp-prev li:first-child{border-top:0}
.imp-prev span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.imp-prev b{white-space:nowrap;font-variant-numeric:tabular-nums}
.imp-sum{font-weight:650;margin:6px 2px 4px}
.glist-head{display:flex;justify-content:space-between;font-size:12.5px;font-weight:600;color:var(--muted);margin:14px 12px 4px}
.glist{list-style:none;margin:0 0 8px;padding:0;border:1px solid var(--line);border-radius:12px}
.glist li{display:flex;align-items:center;gap:10px;padding:2px 8px 2px 12px;border-top:1px solid var(--line)}
.glist li:first-child{border-top:0}
.glist .check{flex:1;min-width:0}
.glist .gname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.glist .cnt{color:var(--muted);font-size:13px;flex:none}
.glist input.gmin{width:66px;height:40px;padding:0 6px;text-align:center;flex:none}

/* scanner: camera on top, the product found below */
#scanView{position:fixed;inset:0;z-index:15;background:var(--bg);display:flex;flex-direction:column}
#scanView header.top{padding-left:4px}
.scan-cam{flex:1;position:relative;overflow:hidden;background:#000;min-height:150px}
.scan-cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scan-aim{position:absolute;left:50%;top:50%;width:min(68vw,300px,70%);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:20px;
  box-shadow:0 0 0 100vmax rgba(0,0,0,.42);border:3px solid rgba(255,255,255,.92);transition:border-color .15s}
.scan-aim.hit{border-color:#4ade80}
.scan-aim.focus{animation:aimFocus .45s ease-out}
@keyframes aimFocus{40%{transform:translate(-50%,-50%) scale(.93)}}
.scan-aim.small{width:min(52vw,220px,60%)}
.scan-tip{position:absolute;left:16px;right:16px;bottom:12px;text-align:center;color:#fff;font-size:14px;font-weight:600;text-shadow:0 1px 3px #000;margin:0}
.scan-msg{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:#fff;font-size:15px;background:#111}
.scan-sheet{background:var(--surface);border-radius:22px 22px 0 0;margin-top:-20px;position:relative;padding:16px 16px calc(14px + var(--inset-bottom));
  max-height:66%;overflow-y:auto;box-shadow:0 -4px 16px rgba(0,0,0,.18)}
.scan-sheet:empty{display:none}
.sc-head{display:flex;gap:12px;align-items:flex-start}
.sc-head .grow{flex:1;min-width:0}
.sc-name{font-size:19px;font-weight:750;margin:0;line-height:1.25}
.sc-sub{color:var(--muted);font-size:13.5px;margin-top:3px}
.sc-price{font-size:26px;font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums}
.sc-code{display:inline-block;font-size:12.5px;font-weight:700;color:var(--muted);background:var(--surface-2);border-radius:8px;padding:3px 8px;margin-top:6px;font-variant-numeric:tabular-nums;letter-spacing:.04em}
.sc-stock{display:flex;align-items:center;gap:12px;margin:14px 0 4px;flex-wrap:wrap}
.sc-stock .lbl{font-weight:650;font-size:14px;color:var(--muted);flex:1;min-width:90px}
.sc-stock .stepper button{width:52px;height:52px;font-size:26px}
.sc-stock input{width:76px;height:52px;border:0;border-left:1.5px solid var(--line);border-right:1.5px solid var(--line);border-radius:0;text-align:center;font-weight:800;font-size:20px;padding:0 4px;background:var(--surface)}
.sc-state{font-size:13.5px;margin:2px 0 0}
.sc-acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.sc-acts .btn{flex:1 1 0;min-width:0;height:48px;padding:0 10px;font-size:14.5px}
.sc-next{margin-top:10px}
.sc-results{list-style:none;margin:8px 0 0;padding:0;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.sc-results li{border-top:1px solid var(--line)}
.sc-results li:first-child{border-top:0}
.sc-results button{display:flex;width:100%;align-items:center;gap:10px;padding:11px 12px;border:0;background:none;text-align:left}
.sc-results button:active{background:var(--surface-2)}
.sc-results .grow{flex:1;min-width:0}
.sc-results small{display:block;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* typing (stock, search, code): the camera makes room for the keyboard */
html.kb #scanView .scan-cam{display:none}
html.kb .scan-sheet{flex:1;max-height:none;margin-top:0;border-radius:0;box-shadow:none}

#toast{position:fixed;inset:auto 16px calc(var(--inset-bottom) + 84px) 16px;max-width:528px;margin:0 auto;background:#1f2937;color:#fff;border:0;
  border-radius:14px;padding:12px 8px 12px 16px;min-height:52px;display:flex;align-items:center;gap:12px;opacity:0;transform:translateY(16px);
  pointer-events:none;transition:opacity .18s,transform .18s;z-index:20;box-shadow:0 8px 24px rgba(0,0,0,.25);width:auto;height:auto;overflow:visible}
html.kb #toast{bottom:12px}
#toast.show{opacity:1;transform:none;pointer-events:auto}
#toast button{margin-left:auto;background:none;border:0;color:#9db8ff;font-weight:800;font-size:14px;letter-spacing:.04em;text-transform:uppercase;padding:8px 10px;flex:none}
#busy{position:fixed;inset:0;background:rgba(0,0,0,.4);display:grid;place-items:center;z-index:30}
#busy .box{background:var(--surface);border-radius:18px;padding:22px 26px;display:flex;align-items:center;gap:14px;font-weight:650}
.spinner{width:26px;height:26px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<header class="top" id="appBar">
  <h1 id="barTitle"></h1>
  <button class="icon-btn" id="barAmounts" data-on="products" data-i18n-label="amounts">
    <svg class="i" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="m13.5 6.5 4 4"/></svg>
  </button>
  <button class="icon-btn" id="barNewProduct" data-on="products" data-i18n-label="newProduct">
    <svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
  </button>
  <button class="icon-btn" id="barGroups" data-on="order" data-i18n-label="groupsTitle">
    <svg class="i" viewBox="0 0 24 24"><path d="M3 5h18l-7 8v6l-4-2v-4z"/></svg>
  </button>
  <button class="icon-btn" id="barShareOrder" data-on="order" data-i18n-label="share">
    <svg class="i" viewBox="0 0 24 24"><circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="m8.2 10.8 7.6-4.4M8.2 13.2l7.6 4.4"/></svg>
  </button>
  <button class="icon-btn" id="barNewLabel" data-on="labels" data-i18n-label="newLabel">
    <svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
  </button>
  <button class="icon-btn" id="barMenu" data-on="products" data-i18n-label="moreOptions">
    <svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="12" cy="19" r="1.3"/></svg>
  </button>
</header>

<div class="menu-scrim" id="menuScrim" hidden></div>
<div class="menu" id="prodMenu" hidden>
  <button data-menu="import"><svg class="i" viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M5 21h14"/></svg><span data-i18n="importDaily"></span></button>
  <button data-menu="delivery"><svg class="i" viewBox="0 0 24 24"><path d="M2 6h12v10H2zM14 9h4l3 3v4h-7"/><circle cx="6.5" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/></svg><span data-i18n="importDelivery"></span></button>
  <button data-menu="export"><svg class="i" viewBox="0 0 24 24"><path d="M12 15V3m-5 5 5-5 5 5M5 21h14"/></svg><span data-i18n="export"></span></button>
</div>

<main id="main">
  <!-- PRODUCTS -->
  <section class="tab active" id="tab-products">
    <div class="search-bar">
      <div class="search">
        <svg class="i sm" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
        <input type="search" id="prodSearch" data-i18n-ph="search" enterkeyhint="search">
      </div>
      <div class="chips" id="catChips"></div>
    </div>
    <p class="amt-hint" id="amtHint" data-i18n="amountsHint" hidden></p>
    <div class="list-head">
      <span class="muted" id="prodCount"></span>
      <button class="text-btn danger" id="btnUnselect"></button>
      <button class="text-btn" id="btnAddAll"></button>
    </div>
    <ul class="list" id="prodList"></ul>
  </section>

  <!-- ORDER -->
  <section class="tab" id="tab-order">
    <div class="card">
      <div class="stats">
        <div class="stat order"><b id="statOrder">0</b><span data-i18n="statOrder"></span></div>
        <div class="stat low"><b id="statLow">0</b><span data-i18n="statLow"></span></div>
      </div>
      <button class="primary" id="btnShareOrder">
        <svg class="i" viewBox="0 0 24 24"><circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="m8.2 10.8 7.6-4.4M8.2 13.2l7.6 4.4"/></svg><span id="shareOrderText"></span>
      </button>
      <div class="card-foot">
        <button class="text-btn" id="btnGroups"></button>
        <button class="text-btn" id="btnDeliveryImport" data-i18n="deliveryCame"></button>
      </div>
    </div>
    <div class="list-head"><h2 data-i18n="orderListHead"></h2></div>
    <ul class="list" id="orderList"></ul>
  </section>

  <!-- LABELS -->
  <section class="tab" id="tab-labels">
    <div class="card">
      <div class="sum-line"><b id="printCount"></b><span class="muted" id="printPer"></span></div>
      <div class="actions">
        <button class="primary" data-action="print">
          <svg class="i" viewBox="0 0 24 24"><path d="M6 9V3h12v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M7 14h10v7H7z"/></svg><span data-i18n="print"></span>
        </button>
        <button class="act" data-action="email">
          <svg class="i" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg><span data-i18n="email"></span>
        </button>
        <button class="act" data-action="share">
          <svg class="i" viewBox="0 0 24 24"><circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="m8.2 10.8 7.6-4.4M8.2 13.2l7.6 4.4"/></svg><span data-i18n="share"></span>
        </button>
        <button class="act" data-action="save">
          <svg class="i" viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M5 21h14"/></svg><span data-i18n="savePdf"></span>
        </button>
      </div>
    </div>
    <div class="list-head">
      <h2 data-i18n="onSheet"></h2>
      <span class="muted" id="sheetCount"></span>
      <button class="text-btn danger" id="btnClear" data-i18n="clearAll"></button>
    </div>
    <ul class="list" id="sheetList"></ul>
    <div class="list-head" id="pagesHead"><h2 data-i18n="pagesHead"></h2></div>
    <div class="pages" id="pages"></div>
    <p class="hint" data-i18n="printHint"></p>
  </section>

  <!-- MORE: data, ordering, label and app settings -->
  <section class="tab" id="tab-more">
    <div class="banner" id="updBanner" hidden>
      <svg class="i" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
      <div class="grow"><b id="updBannerTitle"></b><small data-i18n="updKeepsData"></small></div>
      <button class="btn primary" id="updBannerBtn" data-i18n="updInstall"></button>
    </div>

    <h3 class="sec-title" data-i18n="secData"></h3>
    <div class="card menu-card">
      <p class="db-sum" id="dbSum"></p>
      <button class="row-btn" id="mImport">
        <span class="ri"><svg class="i" viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M5 21h14"/></svg></span>
        <span class="rt"><b data-i18n="importDaily"></b><small data-i18n="importDailySub"></small></span>
      </button>
      <button class="row-btn" id="mDelivery">
        <span class="ri warm"><svg class="i" viewBox="0 0 24 24"><path d="M2 6h12v10H2zM14 9h4l3 3v4h-7"/><circle cx="6.5" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/></svg></span>
        <span class="rt"><b data-i18n="importDelivery"></b><small data-i18n="importDeliverySub"></small></span>
      </button>
      <button class="row-btn" id="mExport">
        <span class="ri"><svg class="i" viewBox="0 0 24 24"><path d="M12 15V3m-5 5 5-5 5 5M5 21h14"/></svg></span>
        <span class="rt"><b data-i18n="export"></b><small data-i18n="exportSub"></small></span>
      </button>
      <button class="row-btn" id="mBackup">
        <span class="ri"><svg class="i" viewBox="0 0 24 24"><path d="M5 3h11l3 3v13a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2z"/><path d="M8 3v5h7V3M8 21v-7h8v7"/></svg></span>
        <span class="rt"><b data-i18n="backup"></b><small data-i18n="backupSub"></small></span>
      </button>
      <button class="row-btn" id="mRestore">
        <span class="ri"><svg class="i" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></span>
        <span class="rt"><b data-i18n="restore"></b><small data-i18n="restoreSub"></small></span>
      </button>
    </div>
    <input type="file" id="importInput" hidden
      accept=".csv,.txt,.tsv,.prn,.xlsx,.xls,.xml,.dbf,.htm,.html,.json,text/*,application/json,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet">

    <h3 class="sec-title" data-i18n="secOrdering"></h3>
    <div class="card menu-card">
      <button class="row-btn" id="mGroups">
        <span class="ri"><svg class="i" viewBox="0 0 24 24"><path d="M3 5h18l-7 8v6l-4-2v-4z"/></svg></span>
        <span class="rt"><b data-i18n="groupsTitle"></b><small id="mGroupsSub"></small></span>
      </button>
      <button class="row-btn" id="mAmounts">
        <span class="ri"><svg class="i" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="m13.5 6.5 4 4"/></svg></span>
        <span class="rt"><b data-i18n="amounts"></b><small data-i18n="amountsSub"></small></span>
      </button>
      <div class="pad"><label class="field"><span data-i18n="orderAt"></span><input id="sOrderAt" inputmode="numeric"></label></div>
    </div>

    <h3 class="sec-title" data-i18n="secLabels"></h3>
    <div class="card">
      <label class="field"><span data-i18n="priceFormat"></span>
        <select id="sPrice"><option value="space">8 500 Ft</option><option value="dot">8.500 Ft</option><option value="dotdash">8.500,- Ft</option><option value="plain">8500 Ft</option></select></label>
      <label class="field"><span data-i18n="layout"></span>
        <select id="sLayout"><option value="3" data-i18n="layout3"></option><option value="2" data-i18n="layout2"></option></select></label>
      <div class="row">
        <label class="field grow"><span data-i18n="cutLines"></span>
          <select id="sCut"><option value="solid" data-i18n="solid"></option><option value="dashed" data-i18n="dashed"></option></select></label>
        <label class="field grow"><span data-i18n="align"></span>
          <select id="sAlign"><option value="left" data-i18n="left"></option><option value="center" data-i18n="center"></option></select></label>
      </div>
      <label class="field"><span data-i18n="drsText"></span><input id="sDrs"></label>
      <label class="check"><input type="checkbox" id="sSkipEmpty"><span data-i18n="skipEmpty"></span></label>
    </div>

    <h3 class="sec-title" data-i18n="secGeneral"></h3>
    <div class="card">
      <label class="field"><span data-i18n="language"></span>
        <select id="sLang"><option value="en">English</option><option value="hu">Magyar</option></select></label>
      <label class="field" style="margin-bottom:0"><span data-i18n="defaultEmail"></span><input id="sEmail" type="email" inputmode="email" placeholder="name@example.com"></label>
    </div>

    <h3 class="sec-title" data-i18n="secApp"></h3>
    <div class="card menu-card">
      <div class="row-btn static">
        <span class="ri"><svg class="i" viewBox="0 0 24 24"><path d="M3 12V4a1 1 0 0 1 1-1h8l9 9-9 9z"/><circle cx="7.5" cy="7.5" r="1.4"/></svg></span>
        <span class="rt"><b data-i18n="appName"></b><small id="verText"></small></span>
      </div>
      <button class="row-btn" id="mUpdate">
        <span class="ri"><svg class="i" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg></span>
        <span class="rt"><b id="updTitle"></b><small id="updSub"></small></span>
      </button>
    </div>
  </section>
</main>

<nav class="bottom">
  <button data-tab="products" class="active">
    <span class="pill"><svg class="i" viewBox="0 0 24 24"><path d="M21 7.5 12 3 3 7.5v9L12 21l9-4.5z"/><path d="M3 7.5 12 12l9-4.5M12 12v9"/></svg></span><span data-i18n="tabProducts"></span>
  </button>
  <button data-tab="order">
    <span class="pill"><svg class="i" viewBox="0 0 24 24"><circle cx="9.5" cy="19.5" r="1.5"/><circle cx="17.5" cy="19.5" r="1.5"/><path d="M2.5 3.5h2.6l2.4 11.2a1 1 0 0 0 1 .8h9a1 1 0 0 0 1-.8L20.5 7H6"/></svg></span><span data-i18n="tabOrder"></span>
    <span class="badge warn" id="orderBadge" hidden></span>
  </button>
  <button class="scan-btn" id="btnScan">
    <span class="scan-c"><svg class="i" viewBox="0 0 24 24"><path d="M3 8V5.5A2.5 2.5 0 0 1 5.5 3H8M16 3h2.5A2.5 2.5 0 0 1 21 5.5V8M21 16v2.5a2.5 2.5 0 0 1-2.5 2.5H16M8 21H5.5A2.5 2.5 0 0 1 3 18.5V16M7 8v8M10 8v8M13.5 8v8M17 8v8"/></svg></span><span data-i18n="tabScan"></span>
  </button>
  <button data-tab="labels">
    <span class="pill"><svg class="i" viewBox="0 0 24 24"><path d="M3 12V4a1 1 0 0 1 1-1h8l9 9-9 9z"/><circle cx="7.5" cy="7.5" r="1.4"/></svg></span><span data-i18n="tabLabels"></span>
    <span class="badge" id="printBadge" hidden></span>
  </button>
  <button data-tab="more">
    <span class="pill"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2.2"/><circle cx="9" cy="17" r="2.2"/></svg></span><span data-i18n="tabMore"></span>
    <span class="dot" id="moreDot" hidden></span>
  </button>
</nav>

<!-- scanner -->
<div id="scanView" hidden>
  <header class="top">
    <button class="icon-btn" id="scanClose" data-i18n-label="close">
      <svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
    <h1 data-i18n="scanTitle"></h1>
    <button class="icon-btn" id="scanTorch" data-i18n-label="torch" hidden>
      <svg class="i" viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>
    </button>
    <button class="icon-btn" id="scanKeys" data-i18n-label="typeCode">
      <svg class="i" viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/></svg>
    </button>
  </header>
  <div class="scan-cam" id="scanCam">
    <video id="scanVideo" playsinline muted></video>
    <div class="scan-aim" id="scanAim"></div>
    <p class="scan-tip" id="scanTip" data-i18n="scanTip"></p>
    <div class="scan-msg" id="scanMsg" hidden></div>
  </div>
  <div class="scan-sheet" id="scanSheet"></div>
</div>

<!-- new label -->
<dialog id="labelDlg">
  <form id="addForm" autocomplete="off" novalidate>
    <div class="sheet-head">
      <h2 data-i18n="newLabel"></h2>
      <button type="button" class="icon-btn" id="labelClose" data-i18n-label="close"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <canvas class="label-preview" id="livePreview"></canvas>

    <label class="field"><span data-i18n="name"></span>
      <input id="fName" enterkeyhint="next" autocapitalize="sentences"></label>
    <div class="suggest" id="suggest" hidden></div>

    <div class="row">
      <label class="field grow"><span data-i18n="price"></span>
        <div class="price-wrap"><input id="fPrice" inputmode="numeric" enterkeyhint="done"></div></label>
      <label class="field unit"><span data-i18n="unit"></span><select id="fUnit"></select></label>
    </div>

    <label class="field"><span data-i18n="detail"></span>
      <input id="fDetail" data-i18n-ph="detailPh" enterkeyhint="done"></label>

    <div class="split">
      <label class="check"><input type="checkbox" id="fDrs"><span data-i18n="drs"></span></label>
      <div class="copies"><span data-i18n="copies"></span>
        <div class="stepper"><button type="button" id="fDec" aria-label="-">−</button><span class="n" id="fCopies">1</span><button type="button" id="fInc" aria-label="+">+</button></div>
      </div>
    </div>
    <label class="check" style="margin-bottom:10px"><input type="checkbox" id="fSave" checked><span data-i18n="saveToProducts"></span></label>

    <button class="primary" type="submit">
      <svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span data-i18n="addToSheet"></span>
    </button>
    <p class="added-note" id="labelNote"></p>
  </form>
</dialog>

<!-- edit label / product -->
<dialog id="editDlg">
  <form id="editForm" autocomplete="off" novalidate>
    <h2 id="editTitle"></h2>
    <canvas class="label-preview" id="editPreview"></canvas>
    <label class="field"><span data-i18n="name"></span><input id="eName"></label>
    <div class="row">
      <label class="field grow"><span data-i18n="price"></span><div class="price-wrap"><input id="ePrice" inputmode="numeric"></div></label>
      <label class="field unit"><span data-i18n="unit"></span><select id="eUnit"></select></label>
    </div>
    <label class="field"><span data-i18n="detail"></span><input id="eDetail" data-i18n-ph="detailPh"></label>
    <div id="eProdRow">
      <label class="field"><span data-i18n="category"></span><input id="eCat" list="catList"></label>

// ---------- state ----------
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function defaultSettings() {
  return {
    lang: (navigator.language || 'en').toLowerCase().startsWith('hu') ? 'hu' : 'en',
    priceFmt: 'space', layout: '3', cut: 'solid', align: 'left', email: '', drsText: '+50 Ft visszaváltási díj',
    skipEmpty: true, orderAt: null, noOrderCats: [], groupMin: {},
  };
}
// a new install starts empty: the shop's item list comes from an import (or a backup), never from the app itself
function defaultState() { return { v: 2, sheet: [], products: [], settings: defaultSettings() }; }
// data saved by an older version (an update keeps the app's storage, so this runs once after it)
function migrate(s) {
  const st = { sheet: [], products: [], ...s, settings: { ...defaultSettings(), ...(s.settings || {}) } };
  if ((st.v || 1) < 2) {
    // "To order" now lists only products that have an amount; the old default (0 = every sold-out item) is dropped
    if (st.settings.orderAt === 0) st.settings.orderAt = null;
    st.v = 2;
  }
  return st;
}
function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) return migrate(JSON.parse(raw));
  } catch (e) { /* fall through to defaults */ }
  return defaultState();
}
let state = load();
save(); // keeps a migrated copy
function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) { /* storage unavailable */ } }

function t(key, vars) {
  const dict = I18N[state.settings.lang] || I18N.en;
  const v = dict[key] ?? I18N.en[key] ?? key;
  return typeof v === 'function' ? v(vars || {}) : v;
}
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const norm = (s) => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').trim();
const parsePrice = (v) => { const d = String(v ?? '').replace(/\D/g, ''); return d ? parseInt(d, 10) : null; };

// ---------- price format ----------
function groupDigits(n, sep) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, sep); }
function priceParts(price) {
  if (price === null || price === undefined || price === '' || isNaN(price)) return null;
  const n = Math.round(Number(price));
  switch (state.settings.priceFmt) {
    case 'dot': return { num: groupDigits(n, '.'), cur: 'Ft' };
    case 'dotdash': return { num: groupDigits(n, '.') + ',-', cur: 'Ft' };
    case 'plain': return { num: String(n), cur: 'Ft' };
    default: return { num: groupDigits(n, ' '), cur: 'Ft' };
  }
}
function priceText(it) {
  const p = priceParts(it.price);
  return p ? `${p.num.replace(/ /g, ' ')} ${p.cur}${it.unit || ''}` : '';
}

// ---------- label layout (all units in mm) ----------
const LW = 70, LH = 30;           // label size
const PAGE_W = 210, PAGE_H = 297; // A4
const M = 20;                     // measuring resolution, px per mm
const FAM_NAME = "'Roboto Condensed','sans-serif-condensed','Arial Narrow',sans-serif";
const FAM_MAIN = "Roboto,'Segoe UI',Arial,sans-serif";
const mctx = document.createElement('canvas').getContext('2d');
const layoutCache = new Map();

function mw(text, weight, size, fam) {
  mctx.font = `${weight} ${size * M}px ${fam}`;
  return mctx.measureText(text).width / M;
}
function wrapWords(text, weight, size, fam, maxW) {
  const lines = []; let cur = '';
  for (const word of text.split(/\s+/).filter(Boolean)) {
    if (mw(word, weight, size, fam) > maxW) return null;
    const test = cur ? cur + ' ' + word : word;
    if (mw(test, weight, size, fam) <= maxW) cur = test; else { lines.push(cur); cur = word; }
  }
  if (cur) lines.push(cur);
  return lines;
}
function ellipsize(text, weight, size, fam, maxW) {
  if (mw(text, weight, size, fam) <= maxW) return text;
  let s = text;
  while (s.length > 1 && mw(s + '…', weight, size, fam) > maxW) s = s.slice(0, -1);
  return s.trimEnd() + '…';
}
// Largest font size (maxSize..minSize) at which text wraps into maxLines; truncates with … if it never fits.
function fitText(text, weight, fam, maxW, maxLines, maxSize, minSize) {
  for (let size = maxSize; ; size = Math.max(minSize, size * 0.95)) {
    const lines = wrapWords(text, weight, size, fam, maxW);
    if (lines && lines.length <= maxLines) return { size, lines, fit: true };
    if (size === minSize) break;
  }
  const size = minSize, lines = [];
  let cur = '';
  for (const word of text.split(/\s+/).filter(Boolean)) {
    const test = cur ? cur + ' ' + word : word;
    if (mw(test, weight, size, fam) <= maxW || !cur) cur = test; else { lines.push(cur); cur = word; }
  }
  if (cur) lines.push(cur);
  const kept = lines.slice(0, maxLines);
  if (lines.length > maxLines || kept.some((l) => mw(l, weight, size, fam) > maxW)) {
    const last = lines.slice(maxLines - 1).join(' ');
    kept[kept.length - 1] = ellipsize(last, weight, size, fam, maxW);
    for (let i = 0; i < kept.length - 1; i++) kept[i] = ellipsize(kept[i], weight, size, fam, maxW);
  }
  return { size, lines: kept, fit: false };
}

function layoutLabel(it) {
  const S = state.settings;
  const key = JSON.stringify([it.name, it.detail, it.price, it.unit, !!it.drs, S.priceFmt, S.align, S.drsText]);
  const hit = layoutCache.get(key);
  if (hit) return hit;

  const ops = [];
  const padX = 4.5, top = 2.4, base = LH - 2.6; // base = price baseline
  const innerW = LW - 2 * padX;
  const centered = S.align === 'center';
  const ax = centered ? LW / 2 : padX, align = centered ? 'center' : 'left';
  let y = top;

  const name = (it.name || '').trim();
  if (name) {
    // prefer one slightly smaller line over two, so prices stay the same size across labels
    let f = fitText(name, 700, FAM_NAME, innerW, 1, 5.6, 4.3);
    if (!f.fit) f = fitText(name, 700, FAM_NAME, innerW, 2, 5.6, 2.6);
    const lh = f.size * 1.13;
    f.lines.forEach((ln, i) => ops.push({ t: ln, w: 700, s: f.size, f: FAM_NAME, x: ax, y: y + f.size * 0.92 + i * lh, a: align }));
    y += f.size * 0.92 + (f.lines.length - 1) * lh + f.size * 0.26;
  }
  const detail = (it.detail || '').trim();
  if (detail) {
    const f = fitText(detail, 400, FAM_MAIN, innerW, 1, 3.4, 2.2);
    y += 0.4;
    ops.push({ t: f.lines[0], w: 400, s: f.size, f: FAM_MAIN, x: ax, y: y + f.size * 0.78, a: align });
    y += f.size * 1.02;
  }
  let drsW = 0;
  const drsText = (S.drsText || '').trim();
  if (it.drs && drsText) {
    // one slightly smaller line rather than "díj" wrapping onto its own; two lines only for a long custom text
    let f = fitText(drsText, 400, FAM_MAIN, 24, 1, 2.5, 1.9);
    if (!f.fit) f = fitText(drsText, 400, FAM_MAIN, 24, 2, 2.5, 1.8);
    const lh = f.size * 1.15;
    f.lines.forEach((ln, i) => {
      ops.push({ t: ln, w: 400, s: f.size, f: FAM_MAIN, x: padX, y: base - (f.lines.length - 1 - i) * lh, a: 'left' });
      drsW = Math.max(drsW, mw(ln, 400, f.size, FAM_MAIN));
    });
  }
  const pp = priceParts(it.price);
  if (pp) {
    const unit = it.unit || '';
    const maxW = innerW - (drsW ? drsW + 2 : 0);
    const width = (P) => mw(pp.num, 800, P, FAM_MAIN) + P * 0.16 + mw(pp.cur, 700, P * 0.55, FAM_MAIN)
      + (unit ? P * 0.04 + mw(unit, 500, P * 0.45, FAM_MAIN) : 0);
    let P = Math.max(3, Math.min(12.5, (base - y - 1.2) / 0.74));
    P = Math.min(P, 10 * maxW / width(10));
    while (P > 3 && width(P) > maxW) P *= 0.97;
    let x = padX + innerW;
    if (unit) { ops.push({ t: unit, w: 500, s: P * 0.45, f: FAM_MAIN, x, y: base, a: 'right' }); x -= mw(unit, 500, P * 0.45, FAM_MAIN) + P * 0.04; }
    ops.push({ t: pp.cur, w: 700, s: P * 0.55, f: FAM_MAIN, x, y: base, a: 'right' });
    x -= mw(pp.cur, 700, P * 0.55, FAM_MAIN) + P * 0.16;
    ops.push({ t: pp.num, w: 800, s: P, f: FAM_MAIN, x, y: base, a: 'right' });
  }
  const L = { ops };
  layoutCache.set(key, L);
  return L;
}

function drawLabel(ctx, it, ox, oy, s) {
  ctx.fillStyle = '#000';
  ctx.textBaseline = 'alphabetic';
  for (const op of layoutLabel(it).ops) {
    ctx.font = `${op.w} ${op.s * s}px ${op.f}`;
    ctx.textAlign = op.a;
    ctx.fillText(op.t, (ox + op.x) * s, (oy + op.y) * s);
  }
}

// ---------- page layout ----------
function geom() {
  return state.settings.layout === '2' ? { cols: 2, rows: 9, x0: 35, y0: 13.5 } : { cols: 3, rows: 9, x0: 0, y0: 13.5 };
}
const perPage = () => { const g = geom(); return g.cols * g.rows; };
function expanded() {
  const out = [];
  for (const it of state.sheet) for (let i = 0; i < Math.max(1, it.copies | 0); i++) out.push(it);
  return out;
}
function pagesOf(list) {
  const per = perPage(), pages = [];
  for (let i = 0; i < list.length; i += per) pages.push(list.slice(i, i + per));
  return pages;
}
// Draws one A4 page at s px/mm. bandY/bandH let the PDF renderer draw the page in horizontal strips.
function drawPage(ctx, items, s, bandY = 0, bandH = Infinity) {
  const g = geom();
  ctx.setTransform(1, 0, 0, 1, 0, -bandY);
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, bandY, PAGE_W * s, Math.min(bandH, PAGE_H * s));
  items.forEach((it, i) => {
    const ox = g.x0 + (i % g.cols) * LW, oy = g.y0 + Math.floor(i / g.cols) * LH;
    if ((oy + LH) * s < bandY || oy * s > bandY + bandH) return;
    drawLabel(ctx, it, ox, oy, s);
  });
  const rowsUsed = Math.ceil(items.length / g.cols);
  if (rowsUsed) {
    const yEnd = items.length === g.cols * g.rows ? PAGE_H : g.y0 + rowsUsed * LH;
    ctx.strokeStyle = '#707070';
    ctx.lineWidth = Math.max(1, 0.2 * s);
    ctx.setLineDash(state.settings.cut === 'dashed' ? [2 * s, 1.4 * s] : []);
    ctx.beginPath();
    for (let r = 0; r <= rowsUsed; r++) {
      const y = (g.y0 + r * LH) * s;
      ctx.moveTo(0, y); ctx.lineTo(PAGE_W * s, y);
    }
    for (let c = 0; c <= g.cols; c++) {
      const x = g.x0 + c * LW;
      if (x < 0.01 || x > PAGE_W - 0.01) continue; // paper edge is already a cut
      ctx.moveTo(x * s, 0); ctx.lineTo(x * s, yEnd * s);
    }
    ctx.stroke();
    ctx.setLineDash([]);
  }
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}

// ---------- PDF ----------
const DPI = 400;
let pdfCache = null;

async function deflate(chunks) {
  const cs = new CompressionStream('deflate');
  const writer = cs.writable.getWriter();
  const result = new Response(cs.readable).arrayBuffer();
  for await (const chunk of chunks) await writer.write(chunk);
  await writer.close();
  return new Uint8Array(await result);
}

async function buildPdf() {
  const pages = pagesOf(expanded());
  if (!pages.length) return null;
  const key = JSON.stringify([state.sheet, state.settings]);
  if (pdfCache && pdfCache.key === key) return pdfCache;

  const s = DPI / 25.4;
  const W = Math.round(PAGE_W * s), H = Math.round(PAGE_H * s), bandH = 512;
  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = bandH;
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  const images = [];
  for (const items of pages) {
    async function* bands() {
      for (let by = 0; by < H; by += bandH) {
        const bh = Math.min(bandH, H - by);
        drawPage(ctx, items, s, by, bh);
        const px = ctx.getImageData(0, 0, W, bh).data;
        const gray = new Uint8Array(W * bh);
        for (let i = 0, j = 0; j < gray.length; i += 4, j++) gray[j] = (px[i] * 77 + px[i + 1] * 150 + px[i + 2] * 29) >> 8;
        yield gray;
      }
    }
    images.push(await deflate(bands()));
  }
  pdfCache = { key, bytes: assemblePdf(images, W, H), pages: pages.length };
  return pdfCache;
}

function assemblePdf(images, W, H) {
  const enc = new TextEncoder();
  const parts = [], offsets = [];
  let pos = 0;
  const push = (x) => { const b = typeof x === 'string' ? enc.encode(x) : x; parts.push(b); pos += b.length; };
  const obj = (n, body) => { offsets[n] = pos; push(`${n} 0 obj\n${body}\nendobj\n`); };
  const PW = '595.2756', PH = '841.8898'; // A4 in points
  const n = images.length, total = 3 + 3 * n;
  const pageNum = (i) => 4 + 3 * i;

  push('%PDF-1.4\n');
  push(new Uint8Array([0x25, 0xE2, 0xE3, 0xCF, 0xD3, 0x0A]));
  obj(1, '<< /Type /Catalog /Pages 2 0 R >>');
  obj(2, `<< /Type /Pages /Kids [${images.map((_, i) => `${pageNum(i)} 0 R`).join(' ')}] /Count ${n} >>`);
  obj(3, '<< /Title (Arcimke labels) /Producer (Arcimke) >>');
  images.forEach((img, i) => {
    const p = pageNum(i), c = p + 1, im = p + 2;
    obj(p, `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PW} ${PH}] /Resources << /XObject << /Im0 ${im} 0 R >> /ProcSet [/PDF /ImageB] >> /Contents ${c} 0 R >>`);
    const content = `q\n${PW} 0 0 ${PH} 0 0 cm\n/Im0 Do\nQ\n`;
    obj(c, `<< /Length ${content.length} >>\nstream\n${content}endstream`);
    offsets[im] = pos;
    push(`${im} 0 obj\n<< /Type /XObject /Subtype /Image /Width ${W} /Height ${H} /ColorSpace /DeviceGray /BitsPerComponent 8 /Filter /FlateDecode /Length ${img.length} >>\nstream\n`);
    push(img);
    push('\nendstream\nendobj\n');
  });
  const xref = pos;
  let x = `xref\n0 ${total + 1}\n0000000000 65535 f \n`;
  for (let i = 1; i <= total; i++) x += String(offsets[i]).padStart(10, '0') + ' 00000 n \n';
  push(x + `trailer\n<< /Size ${total + 1} /Root 1 0 R /Info 3 0 R >>\nstartxref\n${xref}\n%%EOF\n`);

  const out = new Uint8Array(pos);
  let o = 0;
  for (const b of parts) { out.set(b, o); o += b.length; }
  return out;
}

function toBase64(u8) {
  let s = '';
  for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
  return btoa(s);
}
function fileName() {
  const d = new Date(), p = (v) => String(v).padStart(2, '0');
  return `arcimke-${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}.pdf`;
}
function downloadBytes(bytes, name, type = 'application/pdf') {
  const url = URL.createObjectURL(new Blob([bytes], { type }));
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}

async function runAction(kind) {
  if (!state.sheet.length) { toast(t('nothingToPrint')); return; }
  $('#busy').hidden = false;
  let pdf;
  try {
    await new Promise((r) => setTimeout(r, 30)); // let the overlay paint
    pdf = await buildPdf();
  } catch (e) {
    toast(String(e && e.message || e));
    return;
  } finally {
    $('#busy').hidden = true;
  }
  const name = fileName();
  if (isApp) {
    const b64 = toBase64(pdf.bytes);
    if (kind === 'print') window.Android.printPdf(b64, name, pdf.pages);
    else if (kind === 'email') window.Android.shareFile(b64, name, 'application/pdf', 'email', state.settings.email || '', t('emailSubject'));
    else if (kind === 'share') window.Android.shareFile(b64, name, 'application/pdf', 'share', '', t('emailSubject'));
    else if (kind === 'save') {
      const r = String(window.Android.savePdf(b64, name));
      toast(r.startsWith('ok:') ? t('savedTo', { path: r.slice(3) }) : r.replace(/^err:/, ''));
    }
    return;
  }
  // Browser fallback (used when testing outside the Android app)
  const file = new File([pdf.bytes], name, { type: 'application/pdf' });
  if ((kind === 'share' || kind === 'email') && navigator.canShare && navigator.canShare({ files: [file] })) {
    navigator.share({ files: [file], title: t('emailSubject') }).catch(() => {});
  } else if (kind === 'print') {
    window.open(URL.createObjectURL(file), '_blank');
  } else {
    downloadBytes(pdf.bytes, name);
  }
}

// ---------- UI: shared ----------
let currentTab = 'products';
function fillUnits(sel) { sel.innerHTML = UNITS.map((u) => `<option value="${esc(u)}">${u || '—'}</option>`).join(''); }
fillUnits($('#fUnit')); fillUnits($('#eUnit'));

function sizeCanvas(cv, wMm, hMm) {
  const w = cv.clientWidth;
  if (!w) return 0;
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  cv.width = Math.round(w * dpr);
  cv.height = Math.round(w * dpr * hMm / wMm);
  return cv.width / wMm;
}
function drawSingle(cv, it) {
  const s = sizeCanvas(cv, LW, LH);
  if (!s) return;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height);
  drawLabel(ctx, it, 0, 0, s);
}

let toastTimer;
function toast(msg, actionLabel, action) {
  const el = $('#toast');
  el.innerHTML = `<span>${esc(msg)}</span>` + (actionLabel ? `<button type="button">${esc(actionLabel)}</button>` : '');
  if (actionLabel) el.querySelector('button').onclick = () => { el.classList.remove('show'); action(); };
  // as a popover the toast sits above an open dialog too (re-shown, so it's above the newest one)
  if (el.showPopover) { try { if (el.matches(':popover-open')) el.hidePopover(); el.showPopover(); } catch (e) { /* not supported */ } }

// ---------- UI: products tab ----------
const PAGE_ROWS = 300; // a full POS item list has hundreds or thousands of rows: shown in pages
const prodFilter = { q: '', cat: null, limit: PAGE_ROWS, amounts: false };
const catOf = (p) => p.cat || t('other');
const hasStock = (p) => typeof p.stock === 'number';
const isEmpty = (p) => hasStock(p) && p.stock <= 0;
// barcodes linked to the product, as EAN-13 / EAN-8 digits
const codesOf = (p) => p.codes || [];
// whole groups (magazines, vouchers…) and single discontinued products can be kept out of the order list
const orderHidden = (p) => !!p.noOrder || (state.settings.noOrderCats || []).includes(p.cat || '');
// order amount: the product's own, else its group's, else the default from settings; null = not watched
function levelOf(p) {
  if (typeof p.min === 'number') return p.min;
  const g = (state.settings.groupMin || {})[p.cat || ''];
  if (typeof g === 'number') return g;
  return typeof state.settings.orderAt === 'number' ? state.settings.orderAt : null;
}
// 'order' at or below the amount; 'low' when close above it (a quarter more, at least 1) and not full again
function orderState(p) {
  const level = levelOf(p);
  if (!hasStock(p) || orderHidden(p) || level === null) return null;
  if (p.stock <= level) return 'order';
  if (typeof p.full === 'number' && p.stock >= p.full) return null;
  return p.stock <= level + Math.max(1, Math.ceil(level / 4)) ? 'low' : null;
}
// how many to get to be full again
const orderQty = (p) => (typeof p.full === 'number' && hasStock(p) && p.full > p.stock ? p.full - p.stock : 0);
// amount suggested when a full shelf is recorded: about a third of it (2 → 1, 3 → 1, 10 → 3), 0 for a single item
const suggestMin = (full) => (full <= 1 ? 0 : Math.max(1, Math.round(full * 0.3)));
const fmtQty = (n) => String(Math.round(n * 100) / 100).replace('.', ',');
const printable = (list) => (state.settings.skipEmpty ? list.filter((p) => !isEmpty(p)) : list);
const byName = (a, b) => catOf(a).localeCompare(catOf(b), 'hu') || a.name.localeCompare(b.name, 'hu') || norm(a.detail).localeCompare(norm(b.detail), 'hu');
function categories() { return [...new Set(state.products.map(catOf))].sort((a, b) => a.localeCompare(b, 'hu')); }
function filteredProducts() {
  const q = norm(prodFilter.q);
  return state.products
    .filter((p) => (prodFilter.cat === null || catOf(p) === prodFilter.cat)
      && (!q || norm(`${p.name} ${p.detail} ${p.cat} ${p.sku || ''} ${codesOf(p).join(' ')}`).includes(q)))
    .sort(byName);
}
// "Order now" first, then "Running low"
function orderList() {
  const rank = (p) => (orderState(p) === 'order' ? 0 : 1);
  return state.products.filter(orderState).sort((a, b) => rank(a) - rank(b) || byName(a, b));
}
function orderCounts(list = state.products) {
  const n = { order: 0, low: 0 };
  for (const p of list) { const st = orderState(p); if (st) n[st]++; }
  return n;
}
// group chips and badges; also redrawn while amounts are typed into the list
function renderProductHead() {
  const cats = categories();
  if (prodFilter.cat !== null && !cats.includes(prodFilter.cat)) prodFilter.cat = null;
  const chips = [[null, t('all')], ...cats.map((c) => [c, c])], box = $('#catChips'), scroll = box.scrollLeft;
  box.innerHTML = chips.map(([c, label]) =>
    `<button class="chip${prodFilter.cat === c ? ' active' : ''}" data-cat="${c === null ? '' : esc(c)}" data-all="${c === null ? 1 : 0}">${esc(label)}</button>`).join('');
  box.scrollLeft = scroll;
  $('#catList').innerHTML = cats.map((c) => `<option value="${esc(c)}">`).join('');
  const { order } = orderCounts();
  $('#orderBadge').hidden = !order;
  $('#orderBadge').textContent = order > 99 ? '99+' : order;
}
function stockHtml(p) {
  if (!hasStock(p)) return '';
  const st = orderState(p), level = levelOf(p), qty = st === 'order' ? orderQty(p) : 0;
  const text = (level !== null ? t('stockMin', { n: fmtQty(p.stock), m: fmtQty(level) }) : t('stock', { n: fmtQty(p.stock) }))
    + (qty ? ` · ${t('orderN', { n: fmtQty(qty) })}` : '');
  return `<span class="stk${isEmpty(p) ? ' out' : st ? ` ${st}` : ''}">${esc(text)}</span>`;
}
function productSub(p) {
  const sub = esc([p.detail, p.drs ? 'DRS' : ''].filter(Boolean).join(' · ')), stock = stockHtml(p);
  return sub || stock ? `<span class="sub">${sub}${sub && stock ? ' · ' : ''}${stock}</span>` : '';
}
function renderProducts() {
  renderProductHead();
  const amounts = prodFilter.amounts, list = filteredProducts(), total = state.products.length;
  const onSheet = new Map();
  for (const it of state.sheet) if (it.pid) onSheet.set(it.pid, (onSheet.get(it.pid) || 0) + it.copies);
  $('#prodCount').textContent = total ? t('prodCount', { n: list.length, total }) : '';
  const n = printable(list).length;
  $('#btnAddAll').hidden = !n || amounts;
  $('#btnAddAll').textContent = t('addAll', { n });
  const selected = amounts ? 0 : list.filter((p) => onSheet.has(p.id)).length;
  $('#btnUnselect').hidden = !selected;
  $('#btnUnselect').textContent = t('unselectN', { n: selected });

  $('#tab-products .search-bar').hidden = !total;

  if (!total) { // first start: nothing imported yet
    $('#prodList').innerHTML = `<li class="empty"><b>${esc(t('noProductsYet'))}</b>${esc(t('noProductsHint'))}<div class="empty-acts">
      <button class="btn primary" data-act="import">${esc(t('importDaily'))}</button><button class="btn" data-act="newproduct">${esc(t('newProduct'))}</button></div></li>`;
    return;
  }
  if (!list.length) { $('#prodList').innerHTML = `<li class="empty">${esc(t('noProducts'))}</li>`; return; }
  let html = '', lastCat = null;
  for (const p of list.slice(0, prodFilter.limit)) {

      html += `<li class="group${amounts ? ' amts' : ''}"><span class="gname">${esc(lastCat)}</span>${amounts
        ? `<button class="gbtn" data-act="fullnow" data-cat="${esc(p.cat || '')}">${esc(t('fullNow'))}</button><span class="colh">${esc(t('colMin'))}</span><span class="colh">${esc(t('colFull'))}</span>`
        : ''}</li>`;
    }
    const cnt = onSheet.get(p.id);
    // amounts mode: the product's own amount and full stock typed straight into the list; the grey number is the group's
    const inherited = typeof p.min === 'number' ? null : levelOf(p);
    html += `<li class="item" data-id="${p.id}">
      <button class="item-main" data-act="edit"><span class="nm">${esc(p.name)}</span>${productSub(p)}</button>
      ${amounts
        ? `<input class="amt" data-f="min" inputmode="decimal" enterkeyhint="next" aria-label="${esc(t('colMin'))}" value="${typeof p.min === 'number' ? fmtQty(p.min) : ''}" placeholder="${inherited === null ? '' : fmtQty(inherited)}">
      <input class="amt" data-f="full" inputmode="decimal" enterkeyhint="next" aria-label="${esc(t('colFull'))}" value="${typeof p.full === 'number' ? fmtQty(p.full) : ''}">`
        : `<span class="price">${esc(priceText(p))}</span>${codesOf(p).length
          ? `<button class="bc" data-act="code" aria-label="${esc(t('showCode'))}">${BC_ICON}</button>` : ''}
      <button class="add" data-act="add" aria-label="+">+${cnt ? `<span class="cnt">${cnt}</span>` : ''}</button>`}
    </li>`;
  }
  const left = list.length - prodFilter.limit;
  if (left > 0) html += `<li class="more"><button class="gbtn" data-act="more">${esc(t('showMore', { n: Math.min(left, PAGE_ROWS), left }))}</button></li>`;
  $('#prodList').innerHTML = html;
}

$('#prodList').addEventListener('click', (e) => {
